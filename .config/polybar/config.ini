;==========================================================
;
;   Polybar configuration file
;   Matches original i3 bar aesthetic
;
;==========================================================

[colors]
; Light theme colors (default)
background = #ffffff
background-alt = #dddddd
foreground = #000000
foreground-alt = #555555
primary = #000000
secondary = #666666
alert = #ff0000

; These will be used when toggling to dark theme
dark-background = #000000
dark-background-alt = #222222
dark-foreground = #ffffff
dark-foreground-alt = #aaaaaa

[bar/mybar]
width = 100%
height = 24
radius = 0
fixed-center = true

background = ${colors.dark-background}
foreground = ${colors.dark-foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
border-color = ${colors.primary}

padding-left = 0
padding-right = 2

module-margin-left = 1
module-margin-right = 2

font-0 = "monospace:size=8;2"
font-1 = "Font Awesome 5 Free:style=Solid:size=8;2"
font-2 = "Font Awesome 5 Free:style=Regular:size=8;2"
font-3 = "Font Awesome 5 Brands:style=Regular:size=8;2"

modules-left = i3
modules-center = date
modules-right = pulseaudio battery eth wlan tray theme-toggle

tray-position = right
tray-padding = 2
tray-background = ${colors.dark-background}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

; Only show workspaces on the same output as the bar
pin-workspaces = true

label-mode-padding = 2
label-mode-foreground = ${colors.dark-foreground}
label-mode-background = ${colors.primary}

; focused = Active workspace on focused monitor
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

; unfocused = Inactive workspace on any monitor
label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.foreground-alt}

; visible = Active workspace on unfocused monitor
label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.dark-foreground}
label-visible-padding = 2

; urgent = Workspace with urgency hint set
label-urgent = %index%
label-urgent-background = ${colors.dark-background}
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
label-connected = %{A1:nm-connection-editor:}直 %essid%%{A}

format-disconnected = <label-disconnected>
label-disconnected = %{A1:nm-connection-editor:}睊%{A}
label-disconnected-foreground = ${colors.foreground-alt}

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
label-connected = %{A1:nm-connection-editor:} %local_ip%%{A}

format-disconnected = <label-disconnected>
label-disconnected = %{A1:nm-connection-editor:}%{A}
label-disconnected-foreground = ${colors.foreground-alt}

[module/date]
type = internal/date
interval = 5

date = "%Y-%m-%d"
date-alt = "%Y-%m-%d"

time = %H:%M
time-alt = %H:%M:%S

format-prefix-foreground = ${colors.foreground-alt}

label = %date% %time%

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = 墳 %percentage%%
label-volume-foreground = ${colors.dark-foreground}

label-muted = 婢 muted
label-muted-foreground = ${colors.foreground-alt}

click-right = pavucontrol

[module/theme-toggle]
type = custom/text
content = "⚪"
content-foreground = ${colors.dark-foreground}
content-padding = 0
content-margin-left = 0
content-margin-right = 2
click-left = ~/.config/polybar/scripts/theme-switch.sh

[module/tray]
type = internal/tray
tray-spacing = 2px

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.dark-foreground}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.dark-foreground}
label-discharging = %percentage%%

format-full-prefix = " "
format-full-prefix-foreground = ${colors.dark-foreground}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.dark-foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.dark-foreground}
animation-charging-framerate = 750
